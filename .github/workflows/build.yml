name: Build Base Finder

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '**' ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build mod JAR
        run: gradle build
      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: base-finder-fabric-1.21.11
          path: |
            build/libs/base-finder-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

# Rebuild after the renderer outline update.

# Rebuild on latest renderer API update.
